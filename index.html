<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Poem Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>

<body>
    <div class="container">
    <header> <h1> AI Poem Generator</h1> 
    </header>
   <main>
    <form id="poem-generator">
        <input type="text" placeholder="Generate a poem about..." id="user-input"
        autofocus
        required
        autocomplete="off"/>
        <input type="submit" class="submit-button"/>
    </form>
    <div class="poem-container hidden" id="poem-container"> 
    </div>
   </main>

 </footer>
